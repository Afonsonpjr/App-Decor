<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Decor Colors — Showroom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="entry-screen" class="entry-screen" aria-labelledby="entry-title">
    <div class="entry-card">
      <div class="brand-mark" aria-hidden="true">◆</div>
      <p class="eyebrow">DECOR COLORS</p>
      <h1 id="entry-title">Entre no showroom</h1>
      <p class="entry-copy">Informe seu nome e número para iniciar a experiência.</p>
      <form id="entry-form" novalidate>
        <label for="visitor-name">Nome</label>
        <input id="visitor-name" type="text" autocomplete="name" maxlength="80" placeholder="Digite seu nome" required>
        <label for="visitor-number">Número</label>
        <input id="visitor-number" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" placeholder="Digite seu número" required>
        <p id="entry-error" class="form-error" role="alert" hidden></p>
        <button class="primary-button" type="submit">Entrar no showroom</button>
      </form>
      <p class="privacy-note">Os dados ficam apenas nesta sessão do navegador.</p>
    </div>
  </section>
  <div id="loading" role="status" aria-live="polite">Carregando showroom…</div>
  <header class="topbar"><h1>Decor Colors</h1><p id="status">Preparando ambiente…</p><button id="logout" class="logout-button" type="button">Sair</button></header>
  <main id="app" aria-label="Showroom 3D"><canvas id="scene" aria-label="Cena 3D do showroom"></canvas><aside class="help"><strong>Controles</strong><span>Arraste para olhar · Scroll para aproximar</span><span>AR/VR: use um dispositivo compatível</span></aside></main>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/webxr/VRButton.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/webxr/ARButton.js"></script>
  <script src="app.js"></script>
</body>
</html>
