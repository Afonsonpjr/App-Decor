<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>App Decor — Showroom 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading" role="status" aria-live="polite">Carregando showroom…</div>
  <header class="topbar"><h1>Decor Colors</h1><p id="status">Preparando ambiente…</p></header>
  <main id="app" aria-label="Showroom 3D">
    <canvas id="scene" aria-label="Cena 3D do showroom"></canvas>
    <aside class="help"><strong>Controles</strong><span>Arraste para olhar · Scroll para aproximar</span><span>AR/VR: use um dispositivo compatível</span></aside>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/webxr/VRButton.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/webxr/ARButton.js"></script>
  <script src="app.js"></script>
</body>
</html>
